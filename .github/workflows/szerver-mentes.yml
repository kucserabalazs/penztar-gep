# Teljes mentés a tárhelyen: a webáruház admin-, termék-, rendelés- és ügyféladatairól
# biztonsági másolatot készít a tárhelyen belül (webaruhaz/data/mentesek/ÉÉÉÉHHNN-ÓÓPP/).
# Az adatok nem kerülnek a GitHubra és a naplóba sem; csak a fájlnevek száma látszik.
# Indítás: Actions › "Tárhely adatmentése" › Run workflow.

name: Tárhely adatmentése

on:
  workflow_dispatch:

jobs:
  mentes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: lftp telepítése
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Mentés
        env:
          SFTP_HOST: fw.elin.hu
          SFTP_PORT: "2253"
          SFTP_USER: web5109
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          kapcs() { lftp -u "$SFTP_USER,$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; set cmd:fail-exit yes; $1; bye"; }
          CEL=web5109/web; kapcs "cd $CEL" >/dev/null 2>&1 || CEL=web
          M=$(TZ=Europe/Budapest date +%Y%m%d-%H%M)
          D="$RUNNER_TEMP/m"; mkdir -p "$D"; chmod 700 "$D"
          kapcs "lcd $D; cd $CEL/webaruhaz/data; mget -c *" >/dev/null 2>&1 || true
          U="$RUNNER_TEMP/u"; mkdir -p "$U"; kapcs "mirror --no-perms $CEL/webaruhaz/uploads $U" >/dev/null 2>&1 || true
          N=$(ls -1 "$D" | wc -l)
          if [ "$N" -eq 0 ]; then echo "::error::Nem sikerült letölteni az adatfájlokat."; exit 1; fi
          kapcs "cd $CEL/webaruhaz/data; mkdir -p mentesek; mkdir -p mentesek/$M; cd mentesek/$M; lcd $D; mput *" >/dev/null
          if [ -n "$(ls -A "$U" 2>/dev/null)" ]; then kapcs "mirror --reverse --no-perms $U $CEL/webaruhaz/data/mentesek/$M/uploads" >/dev/null; echo "Feltöltött képek is mentve: $(find "$U" -type f | wc -l) fájl"; fi
          echo "Mentve: webaruhaz/data/mentesek/$M ($N adatfájl)"
          rm -rf "$D" "$U"
