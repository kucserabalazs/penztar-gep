# A tároló rendbetétele: a régi, dátumos „mentes-…” ágak törlése (a teljes történetük a tulajdonos
# gépén lévő ETALON git-bundle-ben megvan), és az Etalon címke létrehozása az „etalon” ágra.
name: Tároló rendezése (régi mentés-ágak, Etalon címke)
on:
  workflow_dispatch:
    inputs:
      cimke:
        description: "Az Etalon címke neve (az „etalon” ág mostani állapotára kerül)"
        required: false
        default: "etalon-2026-11-05"
permissions:
  contents: write
jobs:
  rendezes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          set -euo pipefail
          git config user.name "Tároló rendezése"; git config user.email "rendezes@users.noreply.github.com"
          for b in $(git ls-remote --heads origin 'mentes-20*' | awk '{print $2}' | sed 's|refs/heads/||'); do
            git push -q origin --delete "$b" && echo "Törölve: $b"
          done
          C="${{ github.event.inputs.cimke }}"; C=$(printf '%s' "${C:-etalon-2026-11-05}" | tr -cd 'A-Za-z0-9._-')
          if ! git ls-remote --exit-code --tags origin "$C" >/dev/null; then
            git fetch -q origin etalon
            git tag -a "$C" -m "ETALON ÁLLAPOT – $C" FETCH_HEAD
            git push -q origin "$C" && echo "Címke: $C"
          else echo "A(z) $C címke már létezik."; fi
          echo "Ágak:"; git ls-remote --heads origin | awk '{print $2}' | sed 's|refs/heads/||'
