<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pécsi illusztrációk – eszköztár</title>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4efe3;color:#1d2a3a}h1{margin:0;font-size:1.6rem}header{padding:24px 16px;max-width:1200px;margin:auto}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding:0 16px 40px;max-width:1200px;margin:auto}
.k{background:#fffdf6;border:1px solid #e3d7bd;border-radius:14px;overflow:hidden}.k .kep{height:300px;display:grid;place-items:center;padding:12px}.k.sotet .kep{background:#061a33}
.k img{max-width:100%;max-height:100%}.k p{margin:0;padding:10px 14px;border-top:1px solid #e3d7bd;font-size:.9rem}.k code{font-size:.78rem;color:#6b5a3a}</style></head><body>
<header><h1>Pécsi illusztrációk</h1><p>A webes színváltozatok élőben (szépia: világos háttérre, arany: sötét háttérre). Leírás: OLVASS-EL.md</p></header>
<div class="g" id="g"></div>
<script>const N=['szechenyi-ter','dzsami','tv-torony','zsolnay-kut-okorfej','szekesegyhaz'];
document.getElementById('g').innerHTML=N.flatMap(n=>['szepia','arany'].map(v=>`<div class="k ${v==='arany'?'sotet':''}"><div class="kep"><img src="web/${n}-${v}.svg" alt="${n}"></div><p><code>web/${n}-${v}.svg</code></p></div>`)).join('');</script>
</body></html>
